name: Generate CI Badges

on:
  push:
    branches: [ main ]
  # zizmor: ignore[dangerous-triggers]
  # workflow_run runs with the base repository's token and secrets, which is
  # dangerous only when combined with checking out the triggering pull request's
  # code. The checkout below passes no ref, so it takes the default branch and
  # never executes fork-contributed code, and the job holds only contents: read.
  workflow_run:
    workflows: ["Test kubectl.fish Functions"]
    types:
      - completed

permissions:
  contents: read

jobs:
  badge:
    name: Update CI Badge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate badge
        run: |
          echo "CI badge generation completed"
          # Badge URLs are generated automatically by GitHub Actions
          # https://github.com/ssoriche/kubectl.fish/actions/workflows/test.yaml/badge.svg
